[package]
name = "icon-maker"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Rendu OpenGL (glow) : exe bien plus léger que wgpu, largement suffisant ici.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Les traitements d'image restent rapides même en debug.
[profile.dev.package."*"]
opt-level = 2
